[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "document-comparison"
version = "0.1.0"
description = "基于多模态 LLM API 分析比对"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "gunicorn>=21.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.6",
    "python-docx>=1.1",
    "PyMuPDF>=1.24",
    "httpx>=0.27",
    "requests>=2.31",
    "paddleocr>=3.7,<3.8",
    "SQLAlchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
# 真实语义向量(对齐兜底)
embed = ["FlagEmbedding>=1.2"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
