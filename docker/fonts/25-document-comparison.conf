<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  DOCX 原件渲染的稳定字体回退（在系统 Office 度量别名及通用回退之前加载）。

  保留请求的原字体族名，并把开源替代追加在其后：若部署方通过
  /usr/local/share/fonts/authorized 挂载了拥有授权的真实字体，Fontconfig 会优先
  使用真实字体；否则才使用这里指定的替代字体。
-->
<fontconfig>
  <!-- 西文 Office 字体 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>Arial</string></test>
    <edit name="family" mode="append" binding="strong"><string>Liberation Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Calibri</string></test>
    <edit name="family" mode="append" binding="strong"><string>Carlito</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Cambria</string></test>
    <edit name="family" mode="append" binding="strong"><string>Caladea</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>Times New Roman</string></test>
    <edit name="family" mode="append" binding="strong"><string>Liberation Serif</string></edit>
  </match>

  <!-- 简体中文 Word/WPS 字体 -->
  <match target="pattern">
    <test name="family" compare="eq"><string>等线</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>微软雅黑</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>宋体</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>黑体</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Sans CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>仿宋</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq"><string>楷体</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
</fontconfig>
