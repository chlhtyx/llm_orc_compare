# Alembic 配置。sqlalchemy.url 在 env.py 内从 settings.database_url 注入,
# 此处的占位值不会被使用(避免提交真实凭据)。
[alembic]
script_location = alembic
prepend_sys_path = src
sqlalchemy.url = postgresql+psycopg://placeholder/placeholder

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
