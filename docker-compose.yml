services:
  llm-ocr-compare:
    build:
      context: .
      dockerfile: Dockerfile
    image: registry.cn-hangzhou.aliyuncs.com/chldemo/llm-ocr-compare:0.0.8
    container_name: llm-ocr-compare
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - "${DC_PORT:-3012}:8000"
    volumes:
      - dc_data:/app/.dc_data
volumes:
  dc_data:
    driver: local
